<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ - Smart Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8fafc;
            background-image: 
                linear-gradient(#e2e8f0 1px, transparent 1px),
                linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-gray-800 p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-gray-100">
        
        <div class="text-center mb-6">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Smart Tab Logo" class="w-32 h-32 mx-auto object-contain mb-2 drop-shadow-md">
            <h1 class="text-3xl font-bold text-blue-700 tracking-wide">Smart Tab</h1>
        </div>
        
        {% if message %}
            <p class="text-red-500 text-center mb-4 bg-red-50 py-2 rounded-lg text-sm">{{ message }}</p>
        {% endif %}

        <form action="/login" method="POST" class="flex flex-col space-y-4">
            <input type="text" name="username" placeholder="ชื่อผู้ใช้" required 
                   class="p-3 rounded-lg bg-gray-50 border border-gray-300 text-gray-800 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            
            <input type="password" name="password" placeholder="รหัสผ่าน" required 
                   class="p-3 rounded-lg bg-gray-50 border border-gray-300 text-gray-800 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-semibold shadow-md transition duration-200 mt-2">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="relative flex items-center justify-center mt-6 mb-4">
            <div class="w-full h-px bg-gray-200"></div>
            <span class="absolute bg-white px-3 text-sm text-gray-400">หรือ</span>
        </div>

        <!-- ปุ่ม Google (เพิ่ม Alert แจ้งเตือนตรงนี้) -->
        <button type="button" onclick="alert('ระบบเข้าสู่ระบบด้วย Google กำลังอยู่ในช่วงพัฒนาครับ 🛠️')" 
                class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 p-3 rounded-lg font-medium transition shadow-sm">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            เข้าสู่ระบบด้วย Google
        </button>

        <p class="text-center mt-6 text-sm text-gray-500">
            ยังไม่มีบัญชี? <a href="/register" class="text-blue-600 font-semibold hover:underline">สมัครสมาชิกที่นี่</a>
        </p>
    </div>

</body>
</html>
