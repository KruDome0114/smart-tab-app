<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - Smart Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="pb-20 pt-16 flex flex-col min-h-screen text-gray-800">

    <header class="bg-[#004aad] fixed top-0 w-full z-50 shadow-md h-16 flex items-center justify-between px-4 text-white">
        <h1 class="text-xl font-bold tracking-wide">🎸 Smart Tab Feed</h1>
        <div class="w-8 h-8 bg-blue-300 rounded-full flex items-center justify-center font-bold text-[#004aad]">{{ username[0] | upper }}</div>
    </header>

    <main class="flex-grow max-w-lg mx-auto w-full px-4 mt-4 space-y-6">
        
        <!-- วนลูปดึงข้อมูลแท็บที่เซฟไว้ทั้งหมดมาสร้างเป็น Social Feed -->
        {% if feed_tabs %}
            {% for tab in feed_tabs %}
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 bg-[#004aad] rounded-full flex items-center justify-center font-bold text-white shadow">
                        {{ tab[1][0] | upper }}
                    </div>
                    <div>
                        <p class="font-bold text-sm text-gray-900">{{ tab[1] }}</p>
                        <p class="text-xs text-gray-500">แชร์แท็บใหม่</p>
                    </div>
                </div>
                
                <h3 class="font-bold text-lg text-[#004aad] mb-2">{{ tab[2] }}</h3>
                
                <div class="bg-gray-800 text-green-400 font-mono text-xs p-3 rounded-lg overflow-hidden h-24 mb-4 relative">
                    {{ tab[3] }}
                    <div class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-gray-800 to-transparent"></div>
                </div>
                
                <!-- ปุ่มเปิดดูแท็บเต็มๆ -->
                <a href="/view/{{ username }}/{{ tab[0] }}" class="block w-full py-2 bg-blue-50 text-[#004aad] font-bold text-center rounded-xl hover:bg-blue-100 transition border border-blue-200">
                    เปิดดูแท็บนี้
                </a>
            </div>
            {% endfor %}
        {% else %}
            <!-- ถ้ายังไม่มีใครอัดเพลงเลย -->
            <div class="text-center py-20">
                <p class="text-gray-400 mb-4">ยังไม่มีแท็บในระบบเลย...</p>
                <a href="/studio/{{ username }}" class="bg-[#004aad] text-white px-6 py-2 rounded-full font-bold shadow-lg">ไปห้องอัดเป็นคนแรก!</a>
            </div>
        {% endif %}

    </main>

    <nav class="bg-[#004aad] text-white fixed bottom-0 w-full z-50 h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <div class="max-w-md mx-auto h-full flex justify-around items-center px-2">
            <!-- ปุ่ม Home สีขาวเด่น -->
            <button class="flex flex-col items-center justify-center w-14 h-14 bg-white rounded-full shadow-md transform -translate-y-4 border-4 border-blue-200 transition">
                <svg class="w-8 h-8 text-[#004aad]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
            <a href="/profile/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </a>
            <a href="/studio/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </a>
            <a href="/help/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </a>
        </div>
    </nav>
</body>
</html>
