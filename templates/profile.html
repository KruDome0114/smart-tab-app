<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ - Smart Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="pb-24 pt-16 flex flex-col min-h-screen text-gray-800">

    <header class="bg-[#004aad] text-white fixed top-0 w-full z-50 shadow-md h-16 flex items-center justify-center px-4">
        <h1 class="text-xl font-bold tracking-wide">โปรไฟล์ของฉัน</h1>
    </header>

    <main class="flex-grow max-w-lg mx-auto w-full px-4 mt-6">
        
        <div class="bg-white rounded-3xl p-6 shadow-md border border-gray-100 flex flex-col items-center mb-8 relative">
            <a href="/" class="absolute top-4 right-4 text-xs bg-red-100 text-red-500 px-3 py-1 rounded-full font-bold hover:bg-red-200 transition">ออกจากระบบ</a>
            <div class="w-24 h-24 bg-[#004aad] rounded-full flex items-center justify-center text-white text-4xl font-bold mb-4 shadow-inner">
                {{ username[0] | upper }}
            </div>
            <h2 class="text-2xl font-bold text-gray-800">@{{ username }}</h2>
            <p class="text-gray-500 text-sm mt-1">มือกีตาร์นักประดิษฐ์ 🎸</p>
        </div>

        <h3 class="font-bold text-lg text-[#004aad] mb-4 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
            คลังแท็บของฉัน ({{ tabs|length }})
        </h3>
        
        <div class="space-y-4">
            {% if tabs %}
                {% for tab in tabs %}
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col gap-3">
                    <div class="flex items-center justify-between border-b border-gray-100 pb-2">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-blue-100 text-[#004aad] rounded-lg flex items-center justify-center">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2.5L17.5 9H13V4.5zM6 20V4h6v6h6v10H6z"></path></svg>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-800">{{ tab[1] }}</h4>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 3 ปุ่มควบคุม: ดู, แก้ไข, ลบ -->
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        <a href="/view/{{ username }}/{{ tab[0] }}" class="flex items-center justify-center gap-1 bg-blue-50 text-[#004aad] hover:bg-blue-100 px-2 py-2 rounded-lg text-xs font-bold transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            เปิดดู
                        </a>
                        
                        <a href="/edit/{{ username }}/{{ tab[0] }}" class="flex items-center justify-center gap-1 bg-yellow-50 text-yellow-600 hover:bg-yellow-100 px-2 py-2 rounded-lg text-xs font-bold transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            แก้ไข
                        </a>
                        
                        <form action="/delete/{{ username }}/{{ tab[0] }}" method="POST" class="w-full" onsubmit="return confirm('แน่ใจหรือไม่ที่จะลบแท็บเพลง {{ tab[1] }} ทิ้ง?');">
                            <button type="submit" class="w-full flex items-center justify-center gap-1 bg-red-50 text-red-500 hover:bg-red-100 px-2 py-2 rounded-lg text-xs font-bold transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                ลบทิ้ง
                            </button>
                        </form>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="text-center py-10 bg-white rounded-xl shadow-sm border border-gray-100">
                    <p class="text-gray-400 text-sm">คุณยังไม่มีผลงานแท็บเลย</p>
                    <a href="/studio/{{ username }}" class="text-[#004aad] font-bold text-sm hover:underline mt-2 inline-block">+ เริ่มอัดเพลงแรกกันเลย!</a>
                </div>
            {% endif %}
        </div>

    </main>

    <!-- Nav Bar -->
    <nav class="bg-[#004aad] text-white fixed bottom-0 w-full z-50 h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <div class="max-w-md mx-auto h-full flex justify-around items-center px-2">
            <a href="/home/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </a>
            <button class="flex flex-col items-center justify-center w-14 h-14 bg-white rounded-full shadow-md transform -translate-y-4 border-4 border-blue-200 transition">
                <svg class="w-8 h-8 text-[#004aad]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </button>
            <a href="/studio/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </a>
            <a href="/help/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </a>
        </div>
    </nav>
</body>
</html>
