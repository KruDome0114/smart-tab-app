<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องอัด - Smart Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Prompt', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-gray-800 pb-24 pt-14 flex flex-col min-h-screen">

    <header class="bg-[#004aad] text-white fixed top-0 w-full z-50 shadow-md h-14 flex items-center justify-center px-4">
        <h1 class="text-lg font-bold tracking-wide">🎙️ ห้องอัดเสียง (Studio)</h1>
    </header>

    <main class="flex-grow flex flex-col items-center justify-start px-4 mt-8 w-full max-w-2xl mx-auto">
        <div class="mb-6">
            <a href="/tuner/{{ username }}" class="flex items-center gap-2 bg-[#004aad] text-white px-5 py-2 rounded-full font-bold shadow-md hover:bg-blue-800 transition transform hover:scale-105">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                เปิดเครื่องตั้งสาย (Tuner)
            </a>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-lg border border-gray-200 flex flex-col items-center justify-center w-full max-w-sm mb-6" id="main-control-box">
            <p id="record-status" class="text-gray-600 mb-6 text-center text-sm font-medium">เสียบกีตาร์ของคุณ แล้วกดปุ่มเพื่อเริ่มอัดเสียง</p>
            <button id="record-btn" onclick="toggleRecording()" class="relative w-32 h-32 bg-white hover:bg-blue-50 rounded-full flex flex-col items-center justify-center shadow-lg transition transform active:scale-95 border-4 border-[#004aad] text-[#004aad]">
                <svg id="record-icon" class="w-12 h-12 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                <span id="record-text" class="font-bold text-base">เริ่มอัด</span>
            </button>
        </div>

        <!-- จอ Monitor ขณะบันทึกเสียง -->
        <div id="live-tab-container" class="hidden w-full bg-blue-50 rounded-2xl shadow-md border-2 border-blue-200 p-4 transition-all duration-500 opacity-0 translate-y-4">
            <div class="flex items-center justify-between mb-3 border-b border-blue-200 pb-2">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                    <span class="text-xs text-[#004aad] font-bold tracking-widest">RECORDING...</span>
                </div>
                <span class="text-xs text-blue-400 font-bold" id="process-status-text">กำลังอัดเสียง...</span>
            </div>
            
            <div class="h-24 flex items-end justify-center gap-1 overflow-hidden" id="visualizer">
                <!-- แท่งเสียงจะถูกสร้างด้วย JS -->
            </div>
        </div>

        <form id="forward-form" action="/editor/{{ username }}" method="POST" class="hidden">
            <input type="hidden" name="generated_tab" id="hidden-tab-data">
            <input type="hidden" name="audio_file" id="hidden-audio-file">
        </form>
    </main>

    <!-- Nav Bar (เหมือนเดิม) -->
    <nav class="bg-[#004aad] text-white fixed bottom-0 w-full z-50 h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <div class="max-w-md mx-auto h-full flex justify-around items-center px-2">
            <a href="/home/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></a>
            <a href="/profile/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></a>
            <button class="flex flex-col items-center justify-center w-14 h-14 bg-white rounded-full shadow-md transform -translate-y-4 border-4 border-blue-200"><svg class="w-8 h-8 text-[#004aad]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></button>
            <a href="/help/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></a>
        </div>
    </nav>

    <!-- ระบบอัดเสียงฝั่งเบราว์เซอร์ (Client-side) -->
    <script>
        let isRecording = false;
        let audioContext;
        let processor;
        let mediaStream;
        let audioData = [];
        let visualizerInterval;

        // ฟังก์ชันสร้างคลื่นเสียงหลอกให้ UI ดูมีชีวิตชีวา
        function drawVisualizer() {
            const container = document.getElementById('visualizer');
            container.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const bar = document.createElement('div');
                bar.className = 'w-1.5 bg-[#004aad] rounded-t-sm';
                bar.style.height = Math.random() * 100 + '%';
                container.appendChild(bar);
            }
        }

        // ตัวเข้ารหัสแปลงเสียงดิบเป็นไฟล์ .wav มาตรฐาน
        function exportWAV(audioData, sampleRate) {
            const buffer = new ArrayBuffer(44 + audioData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 36 + audioData.length * 2, true);
            writeString(8, 'WAVE'); writeString(12, 'fmt '); view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeString(36, 'data'); view.setUint32(40, audioData.length * 2, true);
            let offset = 44;
            for (let i = 0; i < audioData.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, audioData[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            const icon = document.getElementById('record-icon');
            const text = document.getElementById('record-text');
            const status = document.getElementById('record-status');
            const liveContainer = document.getElementById('live-tab-container');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    mediaStream = stream;
                    const source = audioContext.createMediaStreamSource(stream);
                    
                    // จับเสียงทีละท่อน
                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    source.connect(processor);
                    processor.connect(audioContext.destination);
                    
                    audioData = [];
                    processor.onaudioprocess = (e) => {
                        audioData.push(new Float32Array(e.inputBuffer.getChannelData(0)));
                    };

                    isRecording = true;
                    btn.classList.replace('bg-white', 'bg-red-500');
                    btn.classList.replace('text-[#004aad]', 'text-white');
                    btn.classList.add('animate-pulse');
                    icon.innerHTML = `<rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect>`;
                    text.innerText = "หยุดอัด";
                    status.innerText = "🔴 กำลังฟังเสียงกีตาร์ของคุณ...";
                    status.classList.add('text-red-500', 'font-bold');

                    liveContainer.classList.remove('hidden', 'opacity-0', 'translate-y-4');
                    visualizerInterval = setInterval(drawVisualizer, 150);

                } catch (err) {
                    alert("กรุณาอนุญาตการใช้ไมโครโฟน และใช้งานผ่าน https://");
                }
            } else {
                isRecording = false;
                processor.disconnect();
                mediaStream.getTracks().forEach(track => track.stop());
                clearInterval(visualizerInterval);

                text.innerText = "วิเคราะห์ AI...";
                btn.classList.remove('animate-pulse');
                document.getElementById('process-status-text').innerText = "ส่งข้อมูลให้ AI วิเคราะห์ (อาจใช้เวลาสักครู่)...";
                document.getElementById('visualizer').innerHTML = '<div class="text-blue-500 font-bold mt-6 animate-pulse">กำลังประมวลผลแท็บ...</div>';

                // รวมไฟล์เสียงที่อัดไว้ทั้งหมด
                let length = 0;
                audioData.forEach(item => length += item.length);
                let result = new Float32Array(length);
                let offset = 0;
                audioData.forEach(item => { result.set(item, offset); offset += item.length; });

                // แปลงเป็น .wav และอัปโหลด
                const wavBlob = exportWAV(result, audioContext.sampleRate);
                const formData = new FormData();
                formData.append('audio', wavBlob, 'recording.wav');

                fetch('/api/process_record', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('hidden-tab-data').value = data.tab_data;
                    document.getElementById('hidden-audio-file').value = data.audio_file;
                    document.getElementById('forward-form').submit();
                }).catch(err => {
                    alert("เกิดข้อผิดพลาดในการวิเคราะห์ข้อมูล");
                    location.reload();
                });
            }
        }
    </script>
</body>
</html>
