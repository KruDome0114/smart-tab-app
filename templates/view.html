<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tab[2] }} - Smart Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Prompt', sans-serif; }
        .tab-display {
            font-family: 'Courier New', Courier, monospace;
            line-height: 2.5;
            white-space: pre;
            overflow-x: auto;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-gray-800 pb-24 pt-14 flex flex-col min-h-screen">

    <header class="bg-[#004aad] text-white fixed top-0 w-full z-50 shadow-md h-14 flex items-center justify-between px-4">
        <button onclick="history.back()" class="p-2 hover:bg-blue-800 rounded-full transition text-blue-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-lg font-bold tracking-wide truncate max-w-[200px]">{{ tab[2] }}</h1>
        <div class="w-10"></div> 
    </header>

    <main class="max-w-4xl mx-auto mt-6 px-4 flex-grow w-full">
        <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
            <div class="bg-gray-900 text-white p-4 flex items-center gap-3">
                <div class="w-10 h-10 bg-[#004aad] rounded-full flex items-center justify-center font-bold text-lg border-2 border-white">
                    {{ tab[1][0] | upper }}
                </div>
                <div>
                    <h2 class="font-bold text-lg leading-tight">{{ tab[2] }}</h2>
                    <p class="text-xs text-gray-400">อัปโหลดโดย: @{{ tab[1] }}</p>
                </div>
            </div>

            <!-- เพิ่มส่วนเครื่องเล่นเสียง (ถ้าเพลงนั้นมีไฟล์เสียงแนบมาด้วย) -->
            {% if tab[4] %}
            <div class="px-4 pb-4 pt-4 bg-gray-900 border-t border-gray-700">
                <div class="flex items-center gap-3">
                    <button onclick="document.getElementById('view-playback').play()" class="flex items-center gap-2 bg-green-500 hover:bg-green-400 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-md whitespace-nowrap">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg> ฟังเสียงต้นฉบับ
                    </button>
                    <audio id="view-playback" class="w-full h-10 rounded-lg" controls>
                        <source src="{{ url_for('static', filename=tab[4]) }}" type="audio/wav">
                    </audio>
                </div>
            </div>
            {% endif %}
            
            <div class="p-4 bg-gray-50 overflow-x-auto no-scrollbar">
<!-- โค้ดแท็บชิดซ้ายสุด ห้ามเว้นวรรคหน้า tab[3] -->
<div class="tab-display text-sm md:text-base text-gray-800 min-w-max p-2 border-l-4 border-[#004aad] bg-white shadow-inner">
{{ tab[3] }}
</div>
            </div>
        </div>
    </main>

    <nav class="bg-[#004aad] text-white fixed bottom-0 w-full z-50 h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <div class="max-w-md mx-auto h-full flex justify-around items-center px-2">
            <a href="/home/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </a>
            <a href="/profile/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </a>
            <a href="/studio/{{ username }}" class="flex flex-col items-center justify-center w-14 h-14 bg-gray-600 rounded-full shadow-inner transform -translate-y-4 border-4 border-gray-200 transition">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </a>
            <a href="/help/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </a>
        </div>
    </nav>
</body>
</html>
