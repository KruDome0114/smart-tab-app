<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องตั้งสาย - Smart Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f8fafc; /* เปลี่ยนเป็นพื้นสีเทาอ่อน */
        }
    </style>
</head>
<body class="text-gray-800 pb-24 pt-14 flex flex-col min-h-screen">

    <header class="bg-[#004aad] text-white fixed top-0 w-full z-50 shadow-md h-14 flex items-center justify-between px-4">
        <button onclick="history.back()" class="p-2 hover:bg-blue-800 rounded-full transition text-blue-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-lg font-bold tracking-wide">🎛️ เครื่องตั้งสาย (Tuner)</h1>
        <div class="w-10"></div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center px-4 mt-4 w-full max-w-md mx-auto">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-200 flex flex-col items-center justify-center w-full">
            
            <p class="text-gray-500 mb-6 text-center text-sm font-medium">กดปุ่มด้านล่าง และอนุญาตให้เว็บใช้ไมโครโฟน<br>จากนั้นดีดกีตาร์ทีละสาย</p>

            <div class="w-40 h-40 bg-gray-100 rounded-full flex flex-col items-center justify-center shadow-inner border-4 border-gray-200 mb-8 relative transition-colors duration-300" id="note-circle">
                <span id="note" class="text-6xl font-bold text-gray-400">-</span>
                <span id="detune-text" class="absolute bottom-4 text-xs font-bold text-gray-400">0 cents</span>
            </div>

            <div class="w-full bg-gray-200 h-4 rounded-full relative mb-8">
                <div class="absolute w-1 h-6 bg-gray-800 top-[-4px] left-[50%] transform -translate-x-1/2 z-10"></div>
                <div id="needle" class="absolute w-3 h-6 bg-gray-400 rounded-full top-[-4px] left-[50%] transform -translate-x-1/2 transition-all duration-75 z-20"></div>
                
                <div class="flex justify-between w-full mt-5 text-xs text-gray-400 font-bold px-1">
                    <span>Flat (b)</span>
                    <span>Tune</span>
                    <span>Sharp (#)</span>
                </div>
            </div>

            <button id="start-btn" onclick="startTuner()" class="w-full py-3 bg-[#004aad] text-white rounded-xl font-bold shadow-lg hover:bg-blue-800 transition transform active:scale-95 text-lg">
                เริ่มใช้งาน
            </button>
            <p id="freq" class="mt-4 text-gray-400 text-sm font-mono opacity-0 transition-opacity">0 Hz</p>
        </div>
    </main>

    <nav class="bg-[#004aad] text-white fixed bottom-0 w-full z-50 h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <div class="max-w-md mx-auto h-full flex justify-around items-center px-2">
            <a href="/home/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition transform hover:scale-110">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </a>
            <a href="/profile/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition transform hover:scale-110">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </a>
            <a href="/studio/{{ username }}" class="flex flex-col items-center justify-center w-14 h-14 bg-white rounded-full shadow-md transform -translate-y-4 border-4 border-blue-200 transition">
                <svg class="w-8 h-8 text-[#004aad]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </a>
            <a href="/help/{{ username }}" class="flex flex-col items-center justify-center p-2 text-blue-200 hover:text-white transition transform hover:scale-110">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </a>
        </div>
    </nav>

    <script>
        let audioContext;
        let analyser;
        let isTuning = false;
        let buf = new Float32Array(2048);
        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        async function startTuner() {
            if (isTuning) return;
            
            document.getElementById('start-btn').innerText = "กำลังรับเสียง...";
            document.getElementById('start-btn').classList.remove('bg-[#004aad]', 'hover:bg-blue-800');
            document.getElementById('start-btn').classList.add('bg-green-500', 'cursor-default');
            document.getElementById('freq').classList.remove('opacity-0');
            
            try {
                // ต้องเปิดผ่าน https (เช่น Pinggy) ถึงจะเรียกไมค์ได้
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                
                const mediaStreamSource = audioContext.createMediaStreamSource(stream);
                mediaStreamSource.connect(analyser);
                
                isTuning = true;
                updatePitch();
            } catch (err) {
                alert("เบราว์เซอร์ไม่อนุญาตให้ใช้ไมค์ (ต้องใช้ https:// ถึงจะใช้งานได้ครับ)");
                document.getElementById('start-btn').innerText = "เริ่มใช้งาน";
            }
        }

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;
            for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1; 

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;
            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            let T0 = maxpos;
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function updatePitch() {
            analyser.getFloatTimeDomainData(buf);
            let pitch = autoCorrelate(buf, audioContext.sampleRate);
            
            const noteEl = document.getElementById('note');
            const freqEl = document.getElementById('freq');
            const needle = document.getElementById('needle');
            const detuneText = document.getElementById('detune-text');
            const noteCircle = document.getElementById('note-circle');

            if (pitch == -1) {
                needle.style.left = "50%";
                needle.className = "absolute w-3 h-6 bg-gray-400 rounded-full top-[-4px] left-[50%] transform -translate-x-1/2 transition-all duration-300 z-20";
                detuneText.innerText = "รอเสียงกีตาร์...";
                noteCircle.className = "w-40 h-40 bg-gray-100 rounded-full flex flex-col items-center justify-center shadow-inner border-4 border-gray-200 mb-8 relative transition-colors duration-300";
                noteEl.className = "text-6xl font-bold text-gray-400";
            } else {
                let note = Math.round(12 * (Math.log(pitch / 440) / Math.log(2))) + 69;
                let refFreq = 440 * Math.pow(2, (note - 69) / 12);
                let cents = Math.floor(1200 * Math.log(pitch / refFreq) / Math.log(2));
                
                noteEl.innerText = noteStrings[note % 12];
                freqEl.innerText = Math.round(pitch) + " Hz";
                
                let clampCents = Math.max(-50, Math.min(50, cents));
                let percentage = 50 + clampCents;
                needle.style.left = percentage + "%";
                detuneText.innerText = cents + " cents";

                if (Math.abs(cents) <= 5) {
                    needle.className = "absolute w-3 h-6 bg-green-500 rounded-full top-[-4px] transform -translate-x-1/2 transition-all duration-75 z-20 shadow-[0_0_10px_rgba(34,197,94,0.8)]";
                    noteCircle.className = "w-40 h-40 bg-green-50 rounded-full flex flex-col items-center justify-center shadow-inner border-4 border-green-400 mb-8 relative transition-colors duration-300 shadow-[0_0_20px_rgba(34,197,94,0.3)]";
                    noteEl.className = "text-6xl font-bold text-green-500";
                } else {
                    needle.className = "absolute w-3 h-6 bg-red-500 rounded-full top-[-4px] transform -translate-x-1/2 transition-all duration-75 z-20";
                    noteCircle.className = "w-40 h-40 bg-red-50 rounded-full flex flex-col items-center justify-center shadow-inner border-4 border-red-300 mb-8 relative transition-colors duration-300";
                    noteEl.className = "text-6xl font-bold text-red-500";
                }
            }

            if (isTuning) {
                window.requestAnimationFrame(updatePitch);
            }
        }
    </script>
</body>
</html>
